<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinc3e | Rang Valorant</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
*{box-sizing:border-box}
#overlay{display:inline-flex;align-items:center;gap:8px;margin:0;padding:0;background:transparent!important;border:0!important;outline:0!important;box-shadow:none!important}
#icon{width:45px;height:45px;object-fit:contain;display:none}
#rr{font:900 23px/1 Arial,Helvetica,sans-serif;color:#fff;text-shadow:0 1px 3px #0009;white-space:nowrap}
#debug{display:none;font:12px Arial;color:#ddd;margin-top:8px}
body.preview{background:#263145!important;padding:12px}body.preview #debug{display:block}
</style>
</head>
<body>
<div id="overlay"><img id="icon" alt="Rang Valorant"><span id="rr"></span></div>
<div id="debug" role="status"></div>
<script>
const WORKER_URL='https://valorant.guigui97457.workers.dev/rank';
const icon=document.querySelector('#icon'), rr=document.querySelector('#rr'), debug=document.querySelector('#debug');
if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');
let tiersCache=null;
async function getTierIcon(tier){
 if(!Number.isFinite(Number(tier)))return null;
 if(!tiersCache){
  const res=await fetch('https://valorant-api.com/v1/competitivetiers',{cache:'force-cache'});
  if(!res.ok)throw new Error('Icônes de rang indisponibles');
  const json=await res.json();tiersCache=json.data||[];
 }
 // Prefer most recently published tier collection containing the requested tier.
 for(const season of [...tiersCache].reverse()){
  const entry=season.tiers?.find(t=>t.tier===Number(tier));
  if(entry?.largeIcon||entry?.smallIcon)return entry.largeIcon||entry.smallIcon;
 }
 return null;
}
async function refresh(){
 try{
  const res=await fetch(WORKER_URL,{cache:'no-store'});
  if(!res.ok)throw new Error('Worker HTTP '+res.status);
  const data=await res.json();if(data.error)throw new Error(data.error);
  if(typeof data.rr!=='number')throw new Error('RR absents de la réponse');
  rr.textContent=data.rr+' RR';
  debug.textContent=(data.rank||'Rang inconnu')+' | '+(data.updated_at||'');
  const url=data.icon||await getTierIcon(data.tier);
  if(url){icon.src=url;icon.style.display='block';}else{icon.style.display='none';}
 }catch(err){debug.textContent='Erreur : '+err.message;}
}
refresh();setInterval(refresh,60000);
</script>
</body>
</html>
