<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vinc3e • Valorant RR</title><style>
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden;width:100%;height:100%}*{box-sizing:border-box}#overlay{display:inline-flex;align-items:center;gap:9px;padding:0;margin:0;background:none!important;border:0!important;box-shadow:none!important;outline:0!important;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;color:#fff}#rank-icon{width:48px;height:48px;object-fit:contain;display:none}#rr{font-size:25px;font-weight:900;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.65)}#status{display:none}body.preview #overlay{margin:16px}body.preview #status{display:block;color:#aaa;font:12px Arial;margin:12px 16px}body.preview{background:#253044!important}
</style></head><body><div id="overlay"><img id="rank-icon" alt=""><span id="rr"></span></div><div id="status"></div><script>
const WORKER_URL='https://REPLACE-WITH-YOUR-WORKER.workers.dev/rank';
const qs=new URLSearchParams(location.search);const preview=qs.has('preview');if(preview)document.body.classList.add('preview');const icon=document.getElementById('rank-icon'),rr=document.getElementById('rr'),status=document.getElementById('status');
async function update(){try{const res=await fetch(WORKER_URL,{cache:'no-store'});if(!res.ok)throw Error('stats.json indisponible');const data=await res.json();if(data.error)throw Error(data.error);if(data.rr==null)throw Error('RR non disponible');rr.textContent=`${data.rr} RR`;if(data.icon){icon.src=data.icon;icon.style.display='block'}else{icon.style.display='none'}status.textContent=`${data.rank||'Rang inconnu'} · actualisé : ${data.updated_at||'inconnu'}`;}catch(e){status.textContent=e.message;if(!rr.textContent){rr.textContent=preview?'39 RR':'';if(preview){icon.style.display='none'}}}}
update();setInterval(update,60000);
</script></body></html>
