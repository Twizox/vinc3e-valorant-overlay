name: Actualiser les RR Valorant
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les statistiques
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
        run: python update_stats.py
      - name: Enregistrer les statistiques
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Valorant rank and RR'
            git push
          fi
